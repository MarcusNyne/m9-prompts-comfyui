[project]
name = "m9-prompts-comfyui"
description = "Nodes for modifying a prompt to create prompt variations, for rewriting text, for fitting and cropping images to a target canvas or ratio, for calculating the scale factor that reaches a target megapixel count, and for building file name prefixes.\nScramblePrompts [m9]: Reorder prompts, remove prompts, modify weights\nTweakWeights [m9]: Modify the weights of prompts matching keywords\nFitPose [m9]: Fit a pose/control image into a latent or explicit canvas size without stretching\nCropToRatio [m9]: Trim an image to an aspect ratio, cutting equally from two opposite edges\nCalcScaleFactor [m9]: Calculate the scale factor and 32-pixel-aligned size that bring an image to a target megapixel count\nPrefix [m9]: Join name, theme, scene and frame into a single underscore-separated prefix\nStepReplace [m9]: Rewrite text with up to five search-and-replace steps, with random choices"
version = "1.3.0"
license = { file = "LICENSE" }

